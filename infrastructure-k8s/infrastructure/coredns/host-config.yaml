apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-host-config
  namespace: kube-system
data:
  Corefile: |
    # Local domain resolution for example.com services
    example.com {
        hosts {
            10.0.0.109 example.com
            10.0.0.109 photos.example.com
            10.0.0.109 home.example.com
            10.0.0.109 glance.example.com
            10.0.0.109 grafana.example.com
            10.0.0.109 prometheus.example.com
            10.0.0.109 loki.example.com
            10.0.0.109 traefik.example.com
            # Add more services as needed
        }
        log
        errors
    }

    # All other domains - forward to external DNS + health endpoints
    . {
        forward . 8.8.8.8 8.8.4.4
        cache 30
        reload
        log
        errors
        health :9080
        ready :9181
    }
